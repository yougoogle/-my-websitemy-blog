<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموقع الرسمي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f4;
            color: #333;
        }

        /* شريط العنوان العلوي */
        .header {
            background-color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: relative;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        /* زر القائمة الحمراء */
        .menu-btn {
            font-size: 24px;
            color: #ff3366;
            cursor: pointer;
            border: none;
            background: none;
        }

        /* القائمة الجانبية المنسدلة */
        .nav-menu {
            display: none;
            position: absolute;
            top: 60px;
            left: 0;
            right: 0;
            background-color: #ffffff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            flex-direction: column;
            z-index: 100;
        }

        .nav-menu.active {
            display: flex;
        }

        .nav-menu a {
            padding: 15px 20px;
            text-decoration: none;
            color: #333;
            border-bottom: 1px solid #eee;
            font-weight: bold;
        }

        .nav-menu a:hover {
            background-color: #f9f9f9;
            color: #ff3366;
        }

        /* محتوى الصفحة الرئيسية */
        .content {
            padding: 40px 20px;
            text-align: center;
        }

        .content h1 {
            margin-bottom: 15px;
            color: #222;
        }

        .content p {
            color: #666;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <header class="header">
        <div class="logo">موقعي</div>
        <button class="menu-btn" onclick="toggleMenu()">☰</button>

        <!-- القائمة الجانبية -->
        <nav class="nav-menu" id="navMenu">
            <a href="index.html">الصفحة الرئيسية</a>
            <a href="privacy-policy.html">سياسة الخصوصية</a>
            <a href="about.html">من نحن</a>
            <a href="contact.html">اتصل بنا</a>
            <a href="terms.html">شروط الاستخدام</a>
        </nav>
    </header>

    <!-- محتوى الصفحة -->
    <main class="content">
        <h1>أهلاً بك في الموقع</h1>
        <p>مرحباً بك في موقعنا الإلكتروني. اضغط على رمز القائمة في الأعلى للتنقل بين الصفحات.</p>
    </main>

    <script>
        function toggleMenu() {
            var menu = document.getElementById("navMenu");
            menu.classList.toggle("active");
        }
    </script>
</body>
</html>
